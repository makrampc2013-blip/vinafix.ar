        <!-- 3. نموذج الطلبات المباشر مع رفع الملفات إلى تليجرام -->
        <div class="section-box">
            <h3 id="reqTitle">📥 طلب تعديل ملف أو إرسال دمب صيانة خاص</h3>
            <p class="subtitle" id="reqSub">أدخل تفاصيل اللوحة الأم وارفق ملف البايوس التالف ليصلك فوراً على بوت تليجرام</p>
            
            <form onsubmit="sendOrderWithFileToTelegram(event)">
                <div class="form-group">
                    <label id="lblClientName">اسم الفني أو المركز التقني:</label>
                    <input type="text" id="clientName" class="form-control" required placeholder="مثال: مركز مكرم للصيانة">
                </div>
                <div class="form-group">
                    <label id="lblDeviceModel">رقم موديل البوردة الدقيق (Board Number):</label>
                    <input type="text" id="deviceModel" class="form-control" required placeholder="مثال: DA0AM6MB8D0">
                </div>
                <div class="form-group">
                    <label id="lblMessage">تفاصيل المشكلة أو الخدمة المطلوبة:</label>
                    <textarea id="orderMessage" class="form-control" required placeholder="اكتب تفاصيل الإصلاح أو التعديل المطلوب..."></textarea>
                </div>
                <div class="form-group">
                    <label id="lblFileAttach">إرفاق ملف البايوس أو المخطط (.bin / .rom / صورة):</label>
                    <div class="file-input-wrapper" onclick="document.getElementById('biosFile').click()">
                        <input type="file" id="biosFile" onchange="displayFileName(this)">
                        <span id="filePromptText" style="color: var(--text-muted); font-size: 13px;">📁 اضغط هنا لاختيار الملف من هاتفك</span>
                        <div id="fileNameDisplay" class="file-name-display"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submitOrderBtn">إرسال الطلب والملف إلى تيليجرام</button>
            </form>
        </div>
