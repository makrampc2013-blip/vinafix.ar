<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف | Makram BIOS Fix</title>
    <style>
        :root {
            --bg-color: #05070b;
            --card-bg: #0d1322;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --vip-color: #f59e0b;
            --danger-color: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-bottom: 40px; }

        header {
            background: rgba(13, 19, 34, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-text h1 { font-size: 15px; color: var(--accent-color); font-weight: 700; }
        .logo-text p { font-size: 9px; color: var(--text-muted); }

        .back-link {
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
        .back-link:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .container { max-width: 900px; margin: 20px auto; padding: 0 12px; }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-box h3 { color: var(--accent-color); font-size: 15px; margin-bottom: 12px; text-align: center; }

        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 12px; color: var(--accent-color); }
        .form-control {
            width: 100%;
            padding: 9px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent-color); }

        .file-input-wrapper {
            border: 2px dashed var(--card-border);
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            background-color: var(--bg-color);
            cursor: pointer;
        }
        .file-input-wrapper input { display: none; }
        .file-name-display { margin-top: 5px; font-size: 11px; color: var(--success-color); font-weight: bold; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #05070b;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
        }

        .table-responsive { overflow-x: auto; margin-top: 10px; }
        .bios-table { width: 100%; border-collapse: collapse; text-align: right; white-space: nowrap; }
        .bios-table th, .bios-table td { padding: 9px 11px; border-bottom: 1px solid var(--card-border); font-size: 11px; }
        .bios-table th { background-color: rgba(56, 189, 248, 0.04); color: var(--accent-color); }

        .delete-btn {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-text">
                <h1>Makram BIOS Admin</h1>
                <p>لوحة التحكم والإدارة</p>
            </div>
        </div>
        <a href="index.html" class="back-link">⬅ العودة للموقع</a>
    </header>

    <div class="container">
        <!-- نموذج إضافة ملف جديد محلياً -->
        <div class="section-box">
            <h3>➕ إضافة ملف بايوص أو مخطط جديد (رفع مباشر)</h3>
            <form onsubmit="addNewItem(event)">
                <div class="form-group">
                    <label>القسم:</label>
                    <select id="itemSection" class="form-control">
                        <option value="public">مكتبة الملفات العامة</option>
                        <option value="vip">قسم الـ VIP الحصري</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>موديل اللوحة / الجهاز (مثال: DELL Latitude 5490):</label>
                    <input type="text" id="itemModel" class="form-control" required placeholder="أدخل الموديل واسم البوردة...">
                </div>

                <div class="form-group">
                    <label>وصف الإصدار الفني أو الخدمة:</label>
                    <input type="text" id="itemDesc" class="form-control" required placeholder="مثال: Clean ME Region - Tested 100%">
                </div>

                <div class="form-group">
                    <label>اختر ملف البايوس (.bin / .rom / .rar / كاد):</label>
                    <div class="file-input-wrapper" onclick="document.getElementById('itemFile').click()">
                        <input type="file" id="itemFile" required onchange="showFileName(this)">
                        <span id="filePrompt" style="color: var(--text-muted); font-size: 12px;">📁 اضغط هنا لاختيار الملف من جهازك أو هاتفك</span>
                        <div id="fileDisplay" class="file-name-display"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">رفع وإضافة الملف إلى الجدول</button>
            </form>
        </div>

        <!-- إدارة الملفات الحالية -->
        <div class="section-box">
            <h3>📂 الملفات المرفوعة حالياً في الموقع</h3>
            <div class="table-responsive">
                <table class="bios-table">
                    <thead>
                        <tr>
                            <th>الموديل</th>
                            <th>الوصف</th>
                            <th>اسم الملف المرفوع</th>
                            <th>القسم</th>
                            <th>تحكم</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- يتم تعبئتها تلقائياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let uploadedFilesDB = JSON.parse(localStorage.getItem('makramFilesDB')) || [];

        function showFileName(input) {
            let display = document.getElementById('fileDisplay');
            if (input.files && input.files[0]) {
                display.innerText = "📎 تم اختيار الملف: " + input.files[0].name;
            }
        }

        function addNewItem(event) {
            event.preventDefault();
            let section = document.getElementById('itemSection').value;
            let model = document.getElementById('itemModel').value;
            let desc = document.getElementById('itemDesc').value;
            let fileInput = document.getElementById('itemFile');

            if (fileInput.files && fileInput.files[0]) {
                let file = fileInput.files[0];
                let reader = new FileReader();

                // قراءة الملف وتحويله لتخزينه محلياً بداخل الموقع
                reader.onload = function(e) {
                    let fileDataUrl = e.target.result;

                    let newItem = {
                        id: Date.now(),
                        section: section,
                        model: model,
                        desc: desc,
                        fileName: file.name,
                        fileUrl: fileDataUrl
                    };

                    uploadedFilesDB.push(newItem);
                    localStorage.setItem('makramFilesDB', JSON.stringify(uploadedFilesDB));

                    alert("تم رفع الملف وإضافته بنجاح!");
                    document.getElementById('itemModel').value = '';
                    document.getElementById('itemDesc').value = '';
                    fileInput.value = '';
                    document.getElementById('fileDisplay').innerText = '';
                    renderAdminTable();
                };

                reader.readAsDataURL(file);
            }
        }

        function deleteItem(id) {
            if (confirm("هل أنت متأكد من حذف هذا الملف؟")) {
                uploadedFilesDB = uploadedFilesDB.filter(item => item.id !== id);
                localStorage.setItem('makramFilesDB', JSON.stringify(uploadedFilesDB));
                renderAdminTable();
            }
        }

        function renderAdminTable() {
            let tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            if (uploadedFilesDB.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">لا توجد ملفات مرفوعة حالياً.</td></tr>`;
                return;
            }

            uploadedFilesDB.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.model}</td>
                    <td>${item.desc}</td>
                    <td style="color: var(--accent-color);">${item.fileName}</td>
                    <td>${item.section === 'public' ? 'عام' : 'VIP'}</td>
                    <td><button class="delete-btn" onclick="deleteItem(${item.id})">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = function() {
            renderAdminTable();
        }
    </script>
</body>
</html>
