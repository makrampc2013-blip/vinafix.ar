<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة إدارة المشرف | Makram BIOS Fix</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
            --success-color: #22c55e;
            --vip-color: #f59e0b;
            --danger-color: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* شاشة تسجيل الدخول العصرية */
        #loginScreen {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #111827, #0b0f19);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .login-logo {
            width: 70px;
            height: 70px;
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid var(--vip-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }
        #loginScreen h2 { color: var(--vip-color); font-size: 22px; margin-bottom: 8px; }
        #loginScreen p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }
        .login-input {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .login-input:focus { border-color: var(--vip-color); box-shadow: 0 0 10px rgba(245,158,11,0.2); }
        .login-btn {
            width: 100%;
            background-color: var(--vip-color);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover { opacity: 0.85; transform: translateY(-2px); }

        /* لوحة التحكم الفعلية (تظهر بعد الدخول) */
        #adminDashboard {
            display: none;
            width: 100%;
            max-width: 1000px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .dash-header h2 { color: var(--vip-color); font-size: 20px; }
        .logout-btn { background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.3s; }
        .logout-btn:hover { background-color: var(--danger-color); color: #fff; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-control { width: 100%; padding: 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--vip-color); }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text-muted); }
        .submit-btn { width: 100%; background-color: var(--vip-color); color: #000; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.85; }
        .back-link { display: inline-block; margin-bottom: 15px; color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 13px; }
        
        .bios-table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 15px; }
        .bios-table th, .bios-table td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .bios-table th { background-color: rgba(245, 158, 11, 0.1); color: var(--vip-color); }
        .delete-btn { background-color: var(--danger-color); color: #fff; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول العصرية (تم استبدال النافذة المنبثقة القديمة بها) -->
    <div id="loginScreen">
        <div class="login-logo">🔐</div>
        <h2>لوحة تحكم المشرف</h2>
        <p>Makram BIOS Fix - Security Portal</p>
        <form onsubmit="handleLogin(event)">
            <input type="password" id="adminPassInput" class="login-input" required placeholder="أدخل كلمة مرور المشرف...">
            <button type="submit" class="login-btn">دخول آمن للوحة</button>
        </form>
        <br>
        <a href="index.html" class="back-link">&larr; العودة للموقع الرئيسي</a>
    </div>

    <!-- 2. لوحة التحكم الفعلي بعد تسجيل الدخول -->
    <div id="adminDashboard">
        <div class="dash-header">
            <h2>⚙️ إدارة منصة Makram BIOS Fix</h2>
            <button onclick="logoutAdmin()" class="logout-btn">تسجيل الخروج</button>
        </div>
        
        <a href="index.html" class="back-link">&larr; معاينة الموقع العام</a>

        <form onsubmit="addFile(event)">
            <div class="form-grid">
                <div>
                    <label>قسم النشر:</label>
                    <select id="sectionType" class="form-control">
                        <option value="public">📂 القسم العام (مجاني)</option>
                        <option value="vip">⭐ قسم VIP (حَصري)</option>
                    </select>
                </div>
                <div>
                    <label>موديل اللوحة / الجهاز:</label>
                    <input type="text" id="model" class="form-control" required placeholder="مثال: HP ProBook 450">
                </div>
                <div>
                    <label>وصف الإصدار:</label>
                    <input type="text" id="desc" class="form-control" required placeholder="مثال: Clean ME Tested">
                </div>
                <div>
                    <label>رابط تحميل البايوس:</label>
                    <input type="url" id="biosLink" class="form-control" required placeholder="https://...">
                </div>
                <div>
                    <label>رابط تحميل Boardview:</label>
                    <input type="url" id="bvLink" class="form-control" required placeholder="https://...">
                </div>
            </div>
            <button type="submit" class="submit-btn">➕ نشر الملف في المنصة فوراً</button>
        </form>

        <h3 style="margin-top: 35px; margin-bottom: 10px; color: var(--accent-color); font-size: 16px;">📋 الملفات العامة الحالية:</h3>
        <div style="overflow-x: auto;">
            <table class="bios-table">
                <thead>
                    <tr><th>الموديل</th><th>الوصف</th><th>البايوس</th><th>البوردفيو</th><th>إدارة</th></tr>
                </thead>
                <tbody id="adminPublicBody"></tbody>
            </table>
        </div>

        <h3 style="margin-top: 35px; margin-bottom: 10px; color: var(--vip-color); font-size: 16px;">⭐ ملفات الـ VIP الحصرية الحالية:</h3>
        <div style="overflow-x: auto;">
            <table class="bios-table">
                <thead>
                    <tr><th>الموديل</th><th>الوصف</th><th>البايوس</th><th>البوردفيو</th><th>إدارة</th></tr>
                </thead>
                <tbody id="adminVipBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // التحقق مما إذا كان المشرف مسجل دخول مسبقاً في الجلسة
        window.onload = function() {
            if (localStorage.getItem('makramAdminLogged') === 'true') {
                showDashboard();
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            let pass = document.getElementById('adminPassInput').value;
            if (pass === "makram123") {
                localStorage.setItem('makramAdminLogged', 'true');
                showDashboard();
            } else {
                alert("كلمة مرور المشرف غير صحيحة!");
                document.getElementById('adminPassInput').value = '';
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadTables();
        }

        function logoutAdmin() {
            localStorage.removeItem('makramAdminLogged');
            location.reload();
        }

        function loadTables() {
            let pubTable = localStorage.getItem('makramBiosTable');
            if (pubTable) document.getElementById('adminPublicBody').innerHTML = pubTable;

            let vipTable = localStorage.getItem('makramVipTable');
            if (vipTable) document.getElementById('adminVipBody').innerHTML = vipTable;
        }

        function addFile(event) {
            event.preventDefault();
            let type = document.getElementById('sectionType').value;
            let model = document.getElementById('model').value;
            let desc = document.getElementById('desc').value;
            let biosLink = document.getElementById('biosLink').value;
            let bvLink = document.getElementById('bvLink').value;

            let newRow = document.createElement('tr');
            let labelBadge = type === 'vip' ? '<span style="background:var(--vip-color); color:#000; padding:2px 6px; border-radius:4px; font-size:11px; margin-left:5px;">VIP</span>' : '';
            
            newRow.innerHTML = `
                <td>${labelBadge}${model}</td>
                <td>${desc}</td>
                <td><a href="${biosLink}" target="_blank" style="color:var(--accent-color)">تحميل</a></td>
                <td><a href="${bvLink}" target="_blank" style="color:var(--vip-color)">تحميل</a></td>
                <td><button class="delete-btn" onclick="this.closest('tr').remove(); saveTables();">حذف</button></td>
            `;

            if (type === 'public') {
                document.getElementById('adminPublicBody').appendChild(newRow);
            } else {
                document.getElementById('adminVipBody').appendChild(newRow);
            }

            saveTables();
            document.getElementById('model').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('biosLink').value = '';
            document.getElementById('bvLink').value = '';
            alert("تمت الإضافة بنجاح ونشرها في المنصة!");
        }

        function saveTables() {
            localStorage.setItem('makramBiosTable', document.getElementById('adminPublicBody').innerHTML);
            localStorage.setItem('makramVipTable', document.getElementById('adminVipBody').innerHTML);
        }
    </script>
</body>
</html>
